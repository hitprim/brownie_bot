# Эталонные кулинарные кейсы для регресс-тестов агентов.
# expected_domain — что должен вернуть Router.
# notes — на что смотреть при ручной проверке качества ответа.

- id: chicken_potato_quick
  input: "у меня есть куриное филе, картошка, лук и морковь, что приготовить за 30 минут на двоих?"
  expected_domain: cooking
  notes: "Должен дать 2-3 конкретных рецепта только из этих продуктов, уложиться в 30 минут."

- id: birthday_party
  input: "что приготовить на день рождения на 10 человек"
  expected_domain: cooking
  notes: "Cooking. Может уточнить предпочтения, но домен — cooking."

- id: substitution_followup
  input: "а если нет сметаны?"
  expected_domain: cooking
  notes: "Follow-up на замену. В контексте предыдущего рецепта со сметаной."

- id: empty_fridge
  input: "есть только макароны и яйца"
  expected_domain: cooking
  notes: "Скромный набор — должен предложить реалистичное (карбонара/паста), без выдуманных ингредиентов."
